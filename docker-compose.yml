# Coolify: create a "Docker Compose" resource pointing at this repo (compose file: /docker-compose.yml).
# Assign domains ONLY to the `web` service (e.g. https://cv.velarix.space,https://bob-cv.velarix.space).
# The API and the PDF renderer are not exposed publicly; nginx in `web` proxies /api to the API.
services:
  web:
    build:
      context: ./src
      args:
        NUXT_APP_BASE_URL: /
        # Showcase "Try the demo" link (/?c=<code>); leave empty to hide it.
        NUXT_PUBLIC_DEMO_INVITE_CODE: ${CV_DEMO_INVITE_CODE:-}
        # Git commit of the build (Coolify: enable "Include Source Commit in Build") -> /version.json
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    environment:
      API_UPSTREAM: http://api:8080
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    environment:
      # Required for the admin API (invites, uploads). Leave empty to disable admin endpoints.
      Admin__ApiKey: ${CV_ADMIN_API_KEY:-}
      # Base URL used for invite links of tenants without an own hostname.
      Cv__SharedBaseUrl: ${CV_SHARED_BASE_URL:-}
      # Behind a Cloudflare Tunnel set to CF-Connecting-IP (real client IP for rate limiting).
      Cv__ClientIpHeader: ${CV_CLIENT_IP_HEADER:-}
      # PDF rendering: the renderer opens the app via the internal "web" service.
      # Set CV_PDF_RENDERER_URL to an empty value to disable PDFs.
      Pdf__RendererUrl: ${CV_PDF_RENDERER_URL-http://pdf:3000}
      Pdf__AppBaseUrl: http://web
      # Bump after layout changes so cached PDFs are re-rendered.
      Pdf__LayoutVersion: ${CV_PDF_LAYOUT_VERSION:-1}
      # Read access to a private CV repository (fetches pinned CV versions again). Empty for public repos.
      Git__Token: ${CV_GIT_TOKEN:-}
      # Visitor tracking: IP -> location / network via the internal geo service. Empty = no location data.
      Tracking__GeoUrl: ${CV_GEO_URL-http://geo:3100}
    volumes:
      - cv-data:/data
    expose:
      - "8080"
    restart: unless-stopped

  # Headless Chromium that turns the CV page into a PDF (internal only, called by the API).
  pdf:
    build:
      context: ./pdf
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    environment:
      MAX_CONCURRENT: "2"
    expose:
      - "3000"
    restart: unless-stopped

  # IP -> location / network lookup for the visitor tracking (internal only, called by the API). Downloads the
  # free DB-IP Lite databases (CC BY 4.0) into its volume and refreshes them monthly; no visitor IP leaves the server.
  geo:
    build:
      context: ./geo
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
    volumes:
      - geo-data:/data
    expose:
      - "3100"
    restart: unless-stopped

volumes:
  cv-data:
  geo-data:
