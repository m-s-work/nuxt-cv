# Coolify: create a "Docker Compose" resource pointing at this repo (compose file: /docker-compose.yml).
# Assign domains ONLY to the `web` service (e.g. https://cv.velarix.space,https://bob-cv.velarix.space).
# The API is not exposed publicly; nginx in `web` proxies /api to it.
services:
  web:
    build:
      context: ./src
      args:
        NUXT_APP_BASE_URL: /
    environment:
      API_UPSTREAM: http://api:8080
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      # Required for the admin API (invites, uploads). Leave empty to disable admin endpoints.
      Admin__ApiKey: ${CV_ADMIN_API_KEY:-}
      # Base URL used for invite links of tenants without an own hostname.
      Cv__SharedBaseUrl: ${CV_SHARED_BASE_URL:-}
    volumes:
      - cv-data:/data
    expose:
      - "8080"
    restart: unless-stopped

volumes:
  cv-data:
