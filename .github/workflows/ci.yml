name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  #  branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'src/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./src

      - name: Run tests
        run: npm run test:coverage
        working-directory: ./src

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/app/coverage
          retention-days: 7

      - name: Build
        run: npm run build
        working-directory: ./src

  geo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test geo service
        run: npm ci && npm test
        working-directory: ./geo

  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test API
        run: dotnet test CvApi.sln
        working-directory: ./api

  # End-to-end tests against the full stack (SPA + API + PDF renderer on the sample data), see e2e/README.md.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            src/package-lock.json
            pdf/package-lock.json
            e2e/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          npm ci --prefix src
          npm ci --prefix pdf
          npm ci --prefix e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ./e2e

      - name: Build API
        run: dotnet build CvApi/CvApi.csproj -c Release
        working-directory: ./api

      - name: Run e2e tests
        run: npx playwright test
        working-directory: ./e2e

      - name: Upload e2e report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
